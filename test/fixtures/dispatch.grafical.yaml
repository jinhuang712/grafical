grafical: 1
title: dispatch
subtitle: How a trip request reaches a driver and is paid, across the booking, matching and payments systems.
note: "Not shown: ops console admin paths, auth token flow details, retries."
density: normal
layers:
  - id: callers
    label: Callers
    nodes:
      - id: rider-app
        label: rider-app
        kind: actor
        sublabel: mobile
      - id: ops-console
        label: ops-console
        kind: actor
        sublabel: web
      - id: driver-app
        label: driver-app
        kind: actor
        sublabel: mobile
  - id: edge
    label: Edge
    nodes:
      - id: edge-gateway
        label: edge-gateway
        kind: service
        sublabel: TLS, rate limits
      - id: driver-socket
        label: driver-socket
        kind: service
        sublabel: WebSocket
      - id: auth-svc
        label: auth-svc
        kind: service
        sublabel: tokens
  - id: services
    label: Services
    nodes:
      - id: notify-svc
        label: notify-svc
        kind: service
        sublabel: push
      - id: booking-api
        label: booking-api
        kind: service
        sublabel: trips
        group: booking
      - id: fare-estimator
        label: fare-estimator
        kind: service
        sublabel: quotes
        group: booking
      - id: matcher
        label: matcher
        kind: service
        sublabel: offers trips
        group: matching
      - id: location-ingest
        label: location-ingest
        kind: service
        group: matching
      - id: surge-calculator
        label: surge-calculator
        kind: service
        sublabel: every minute
        group: matching
      - id: payments-api
        label: payments-api
        kind: service
        sublabel: holds, captures
        group: payments
      - id: payout-batch
        label: payout-batch
        kind: service
        sublabel: nightly
        group: payments
  - id: bus
    label: Events
    nodes:
      - id: events
        label: events
        kind: queue
        sublabel: Kafka topics
  - id: stores
    label: Stores
    nodes:
      - id: trips-db
        label: trips-db
        kind: store
        sublabel: Postgres
        group: booking
      - id: zones-db
        label: zones-db
        kind: store
        sublabel: Postgres
        group: booking
      - id: geo-index
        label: geo-index
        kind: store
        sublabel: Redis geo
        group: matching
      - id: surge-cache
        label: surge-cache
        kind: store
        sublabel: Redis
        group: matching
      - id: ledger-db
        label: ledger-db
        kind: store
        sublabel: Postgres
        group: payments
      - id: auth-redis
        label: auth-redis
        kind: store
        sublabel: Redis
  - id: outside
    label: External
    nodes:
      - id: push-provider
        label: push-provider
        kind: external
      - id: card-processor
        label: card-processor
        kind: external
      - id: bank-transfers
        label: bank-transfers
        kind: external
groups:
  - id: booking
    label: booking
  - id: matching
    label: matching
  - id: payments
    label: payments
