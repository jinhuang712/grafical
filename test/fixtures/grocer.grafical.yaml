grafical: 1
title: grocer architecture
subtitle: Customer, warehouse and courier apps call APIs that share Kafka events and per-service stores.
note: "Not shown: team ownership, retries, the warehouse network and internal auth between services."
density: normal
layers:
  - id: row-callers
    label: Callers
    nodes:
      - id: customers
        label: Shoppers
        kind: actor
        sublabel: web, mobile app
      - id: picker-app
        label: Pickers
        kind: actor
        sublabel: handheld app
      - id: courier-app
        label: Couriers
        kind: actor
        sublabel: mobile app
      - id: care-desk
        label: Care agents
        kind: actor
        sublabel: web app
      - id: partner-feeds
        label: Suppliers
        kind: external
        sublabel: hourly feeds
  - id: row-edge
    label: Edge
    nodes:
      - id: cdn
        label: CDN
        kind: external
      - id: api-gateway
        label: API gateway
        kind: service
        sublabel: routing, rate limits
      - id: identity-svc
        label: Identity
        kind: service
        sublabel: sign-in, tokens
  - id: row-api
    label: APIs
    nodes:
      - id: storefront-bff
        label: Storefront BFF
        kind: service
        sublabel: one API for shop apps
      - id: picking-api
        label: Picking API
        kind: service
      - id: courier-api
        label: Courier API
        kind: service
      - id: care-api
        label: Care API
        kind: service
  - id: row-svc
    label: Services
    nodes:
      - id: search-api
        label: Search API
        kind: service
        sublabel: product search
      - id: cart-svc
        label: Cart
        kind: service
        sublabel: carts, prices
      - id: catalog-api
        label: Catalog API
        kind: service
        sublabel: products, images
      - id: pricing-svc
        label: Pricing
        kind: service
        sublabel: prices, promotions
      - id: orders-api
        label: Orders API
        kind: service
        sublabel: place, change, cancel
      - id: payments-svc
        label: Payments
        kind: service
        sublabel: authorise, capture
      - id: stock-svc
        label: Stock
        kind: service
        sublabel: reservations
      - id: recommender
        label: Recommender
        kind: service
        sublabel: you may also like
      - id: eta-svc
        label: ETA
        kind: service
        sublabel: arrival times
  - id: row-jobs
    label: Workers
    nodes:
      - id: feed-importer
        label: Feed importer
        kind: service
        sublabel: hourly
      - id: indexer
        label: Indexer
        kind: service
        sublabel: catalog to search
      - id: wave-planner
        label: Wave planner
        kind: service
        sublabel: every 10 min
      - id: route-planner
        label: Route planner
        kind: service
        sublabel: courier routes
      - id: invoicer
        label: Invoicer
        kind: service
        sublabel: invoices
      - id: push-svc
        label: Push
        kind: service
        sublabel: app pushes
      - id: mailer
        label: Mailer
        kind: service
        sublabel: sends email
      - id: label-printer
        label: Label printer
        kind: service
        sublabel: warehouse device
  - id: row-bus
    label: Events
    nodes:
      - id: events
        label: Kafka events
        kind: queue
        sublabel: 6 topics
  - id: row-db
    label: Databases
    nodes:
      - id: identity-db
        label: Identity DB
        kind: store
        sublabel: Postgres
      - id: catalog-db
        label: Catalog DB
        kind: store
        sublabel: Postgres
      - id: pricing-db
        label: Pricing DB
        kind: store
        sublabel: Postgres
      - id: orders-db
        label: Orders DB
        kind: store
        sublabel: Postgres
      - id: payments-db
        label: Payments DB
        kind: store
        sublabel: Postgres
      - id: stock-db
        label: Stock DB
        kind: store
        sublabel: Postgres
      - id: waves-db
        label: Waves DB
        kind: store
        sublabel: Postgres
      - id: routes-db
        label: Routes DB
        kind: store
        sublabel: Postgres
      - id: tickets-db
        label: Tickets DB
        kind: store
        sublabel: Postgres
  - id: row-cache
    label: Caches and search
    nodes:
      - id: session-redis
        label: Sessions
        kind: store
        sublabel: Redis
      - id: cart-redis
        label: Carts
        kind: store
        sublabel: Redis
      - id: reco-cache
        label: Reco cache
        kind: store
        sublabel: Redis
      - id: eta-redis
        label: ETA cache
        kind: store
        sublabel: Redis
      - id: search-index
        label: Search index
        kind: store
        sublabel: Elasticsearch
  - id: row-objects
    label: Object storage
    nodes:
      - id: image-store
        label: Image store
        kind: store
        sublabel: object storage
      - id: invoice-store
        label: Invoices
        kind: store
        sublabel: object storage
      - id: analytics-lake
        label: Analytics lake
        kind: store
        sublabel: nightly Kafka copy
  - id: row-ext
    label: External
    nodes:
      - id: card-gateway
        label: Card gateway
        kind: external
      - id: maps-api
        label: Maps API
        kind: external
      - id: mail-provider
        label: Mail provider
        kind: external
      - id: push-provider
        label: Push provider
        kind: external
